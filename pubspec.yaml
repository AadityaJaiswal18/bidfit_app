name: bidfit_app
description: A demo Online Expense Management App for Flutter.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # For state management and API integration
  provider: ^6.1.1
  http: ^1.2.0

  # For UI and icons
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.0

  # For offline data storage (optional)
  hive: ^2.2.3
  intl: ^0.18.0
  fl_chart: ^0.69.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.0.15
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
